name: Release

on:
  push:
    tags: ["v*.*.*"]

# Default to read-only; the release job elevates to contents: write below.
permissions:
  contents: read

jobs:
  release:
    name: Build & publish release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Publish single-file executable
        run: dotnet publish src/CitiusMonitor -c Release -o publish --no-restore

      - name: Create GitHub Release and attach Citius.exe
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          "publish/Citius.exe"
          --repo "${{ github.repository }}"
          --title "Citius Monitor ${{ github.ref_name }}"
          --generate-notes
