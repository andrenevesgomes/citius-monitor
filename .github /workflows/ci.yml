name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the build only needs to read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Build (analyzers, warnings-as-errors)
        run: dotnet build -c Release --no-restore

      - name: Publish single-file executable
        run: dotnet publish src/CitiusMonitor -c Release -o publish --no-restore

      - name: Upload executable artifact
        uses: actions/upload-artifact@v7
        with:
          name: Citius-win-x64
          path: publish/Citius.exe
          if-no-files-found: error
          retention-days: 30
